name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Project Setup
        run: |
          npm run setup
          npm run dev:deamon

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      
          custom_instructions: |
          This project is already setup with all the dependencies installed. The server is already running at localhost:3000. Logs from it are
          being written to logs.txt. If needed, you can query the db with the "sqlite3" cli. If needed, use the mcp__playwright set of tools to launch
          a browser and interact with the app.

          mcp_config: |
          {
            "mcpServers": {
              "playwright": {
              "command": "npx",
              "args": [
                "@playwright/mcp@latest",
                "--allowed-origins",
                "localhost: 3000; cdn.tailwindcss.com;esm.sh"
              ]
              }
            }
          } 

        allowed_tools: "Bash(npm:*), Bash(sqlite3:*), mcp__playwright__browser_snapshot,mcp__playwright__browser_click,"